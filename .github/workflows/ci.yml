name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 24 on Windows
    runs-on: windows-latest
    timeout-minutes: 30

    # Node 22 não é suportado nesta versão: better-sqlite3@13.2.0 não obteve
    # um prebuild compatível no runner Windows/Node 22 e o fallback node-gyp
    # não reconheceu o Visual Studio 18 do runner. Node 24 é o runtime validado.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm.cmd ci

      - name: Typecheck
        run: npm.cmd run typecheck

      - name: Test
        run: npm.cmd test

      - name: Build
        run: npm.cmd run build

      # Informativo: a rede/advisory database do GitHub pode mudar sem uma
      # alteração deste repositório. Não torne o CI frágil por isso.
      - name: Production dependency audit (informational)
        continue-on-error: true
        run: npm.cmd audit --omit=dev
